exam: AWS Certified AI Practitioner (AIF-C01)
blueprint_version: '1.1'
taxonomy_version: 1.0.3
domain:
  id: D2
  name: Fundamentals of GenAI
  official_weight_percent: 24
  task_statements:
  - id: '2.1'
    summary: Core GenAI and agentic AI concepts
  - id: '2.2'
    summary: GenAI capabilities, limitations, and business value
  - id: '2.3'
    summary: AWS technologies for GenAI applications
  concepts:
  - id: token
    name: Tokens
    task: '2.1'
    type: genai-concept
    definition: Tokens are the text units processed and generated by language models; token counts influence context
      use, latency, and cost.
    question_signals:
    - basic unit of text
    - token pricing
    - input tokens
    - output tokens
  - id: embedding-vector
    name: Embeddings and vectors
    task: '2.1'
    type: genai-concept
    definition: Embeddings are numerical vector representations that capture semantic properties and enable similarity
      search.
    question_signals:
    - numerical meaning
    - vector space
    - semantic similarity
    contrast_with:
    - token
  - id: transformer
    name: Transformer models
    task: '2.1'
    type: architecture
    definition: Transformers use attention mechanisms to model contextual relationships efficiently.
    question_signals:
    - self-attention
    - contextual embeddings
    - GPT
  - id: diffusion-model
    name: Diffusion models
    task: '2.1'
    type: architecture
    definition: Diffusion models learn to reverse a noising process to generate high-quality samples, commonly images.
    question_signals:
    - noise
    - denoising
    - image generation
    - Stable Diffusion
  - id: foundation-model
    name: Foundation models
    task: '2.1'
    type: genai-concept
    definition: Large pre-trained models that provide broad capabilities and can be adapted to multiple downstream
      tasks.
    question_signals:
    - pre-trained
    - multiple tasks
    - FM lifecycle
    contrast_with:
    - llm
  - id: llm
    name: Large language models
    task: '2.1'
    type: genai-concept
    definition: Foundation models specialized for understanding and generating language.
    question_signals:
    - text generation
    - summarization
    - translation
    - question answering
    contrast_with:
    - foundation-model
  - id: multimodal-model
    name: Multimodal models
    task: '2.1'
    type: genai-concept
    definition: Models capable of working with more than one modality, such as text, image, audio, or video.
    question_signals:
    - mix of input types
    - audio/text
    - video/image
  - id: generative-vs-discriminative
    name: Generative vs discriminative models
    task: '2.1'
    type: concept
    definition: Generative models model patterns to create new data; discriminative models distinguish classes or
      predict labels.
    question_signals:
    - generate new data
    - classify
    - decision boundary
  - id: context-engineering
    name: Context engineering
    task: '2.1'
    type: application-design
    definition: Designs how relevant instructions, retrieved data, memory, tool results, and conversation state
      are assembled for a model at runtime.
    question_signals:
    - current company information
    - assemble context
    - retrieved data
    - memory
    contrast_with:
    - prompt-engineering
  - id: genai-limitations
    name: GenAI limitations
    task: '2.2'
    type: risk
    definition: GenAI can hallucinate, be inaccurate, non-deterministic, hard to interpret, and sensitive to context
      and prompt design.
    question_signals:
    - hallucination
    - nondeterministic
    - inaccuracy
    - interpretability
  - id: genai-business-value
    name: GenAI business value and metrics
    task: '2.2'
    type: evaluation
    definition: Assess whether GenAI improves measurable outcomes such as efficiency, conversion, user satisfaction,
      cost, or revenue.
    question_signals:
    - conversion rate
    - ARPU
    - efficiency
    - user satisfaction
  - id: bedrock
    name: Amazon Bedrock
    task: '2.3'
    type: aws-service
    definition: Managed AWS service for building generative AI applications with foundation models from multiple
      providers and related capabilities.
    question_signals:
    - foundation models
    - managed FM access
    - single API
    - generative AI application
    contrast_with:
    - sagemaker-jumpstart
    aws_services:
    - Amazon Bedrock
  - id: sagemaker-jumpstart
    name: SageMaker JumpStart
    task: '2.3'
    type: aws-feature
    definition: ML hub with pre-trained models, foundation models, evaluation, customization, and solution templates.
    question_signals:
    - pre-trained models
    - one-click
    - evaluate compare select FMs
    contrast_with:
    - bedrock
    aws_services:
    - Amazon SageMaker JumpStart
  - id: amazon-q-family
    name: Amazon Q family
    task: '2.3'
    type: aws-service-family
    definition: AWS generative AI assistants specialized for enterprise work, development, contact center assistance,
      and analytics experiences.
    question_signals:
    - Amazon Q Developer
    - Amazon Q Business
    - Q in Connect
    - Q in QuickSight
  - id: amazon-q-developer
    name: Amazon Q Developer
    task: '2.3'
    type: aws-service
    definition: Generative AI assistant for software development and AWS operations, including coding help and questions
      about AWS resources.
    question_signals:
    - coding
    - testing
    - upgrading applications
    - AWS resources
    - IDE
    aws_services:
    - Amazon Q Developer
  - id: amazon-q-business
    name: Amazon Q Business
    task: '2.3'
    type: aws-service
    definition: Enterprise generative AI assistant grounded in organizational data that can answer questions, summarize,
      create content, and perform supported actions.
    question_signals:
    - enterprise systems
    - permissions-aware
    - summaries
    - plugins
    aws_services:
    - Amazon Q Business
  - id: amazon-q-connect
    name: Amazon Q in Connect
    task: '2.3'
    type: aws-service
    definition: Generative AI assistance for customer service/contact center agents using conversation and relevant
      content.
    question_signals:
    - customer service agents
    - contact center
    aws_services:
    - Amazon Q in Connect
  - id: bedrock-pricing
    name: Bedrock pricing and capacity
    task: '2.3'
    type: cost
    definition: On-demand usage commonly follows model-specific input/output usage; provisioned throughput is suited
      to large predictable steady workloads where reserved capacity is beneficial.
    question_signals:
    - provisioned throughput
    - steady workload
    - tokens
    - cost
  - id: agent-loop
    name: Agent loop
    task: '2.1'
    type: agentic-ai
    definition: A model decides whether to call a tool, the tool executes, the result returns to the model, and
      the cycle continues until completion.
    question_signals:
    - tool call
    - repeat until final response
    - model tool result
  - id: mcp
    name: Model Context Protocol (MCP)
    task: '2.1'
    type: agentic-ai
    definition: A standardized protocol for agents or AI applications to discover and invoke tools and access external
      resources.
    question_signals:
    - standardized tool interface
    - tools/list
    - tools/call
    - external systems
    aws_services:
    - AgentCore Gateway
    - Kiro
    - Strands Agents
  - id: agent-memory
    name: Agent memory
    task: '2.1'
    type: agentic-ai
    definition: Short-term memory holds session interaction context; long-term memory can persist extracted preferences,
      facts, or summaries across sessions.
    question_signals:
    - short-term memory
    - long-term memory
    - preferences across sessions
    aws_services:
    - Amazon Bedrock AgentCore Memory
  - id: multi-agent
    name: Multi-agent patterns
    task: '2.1'
    type: agentic-ai
    definition: Multiple agents collaborate through patterns such as workflows, graphs, delegation, or agents-as-tools.
    question_signals:
    - multi-agent
    - graphs
    - workflows
    - agents-as-tools
    aws_services:
    - Strands Agents
  - id: strands-agents
    name: Strands Agents SDK
    task: '2.3'
    type: aws-technology
    definition: Open-source model-first SDK for building agents using models, tools, agent loops, MCP integrations,
      and multi-agent patterns.
    question_signals:
    - model-first SDK
    - MCP tools
    - agent loop
    - multi-agent
    aws_services:
    - Strands Agents
  - id: kiro
    name: Kiro
    task: '2.3'
    type: aws-technology
    definition: AI development environment with specs, steering, hooks, and MCP integrations for structured software
      work.
    question_signals:
    - specs
    - steering
    - hooks
    - MCP server
    aws_services:
    - Kiro
  - id: agentcore
    name: Amazon Bedrock AgentCore
    task: '2.3'
    type: aws-service
    definition: Modular AWS services for securely deploying, connecting, remembering, observing, evaluating, and
      governing agents across frameworks and models.
    question_signals:
    - Runtime
    - Memory
    - Gateway
    - Identity
    - Policy
    - Observability
    aws_services:
    - Amazon Bedrock AgentCore
  - id: agentcore-runtime
    name: AgentCore Runtime
    task: '2.3'
    type: agentcore-capability
    definition: Secure serverless runtime for hosting agent code with isolation and scaling while retaining the
      application orchestration logic.
    question_signals:
    - secure serverless hosting
    - session isolation
    - existing agent framework
    aws_services:
    - AgentCore Runtime
  - id: agentcore-gateway
    name: AgentCore Gateway
    task: '2.3'
    type: agentcore-capability
    definition: Exposes backend resources such as APIs and functions as governed agent tools and can provide a standardized
      tool interface.
    question_signals:
    - Lambda functions
    - REST APIs
    - targets
    - gateway
    - tools
    aws_services:
    - AgentCore Gateway
  - id: agentcore-identity
    name: AgentCore Identity
    task: '2.3'
    type: agentcore-capability
    definition: Manages agent access to external resources and credential lifecycles, including OAuth-style user
      access patterns.
    question_signals:
    - OAuth
    - credential provider
    - third-party SaaS
    aws_services:
    - AgentCore Identity
