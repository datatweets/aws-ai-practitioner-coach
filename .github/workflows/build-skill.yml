name: Build Claude Skill

on:
  push:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'templates/**'
      - 'scripts/package_skill.py'
      - '.github/workflows/build-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Claude Skill ZIP
        run: python scripts/package_skill.py

      - name: Verify Claude ZIP structure
        run: |
          python - <<'PY'
          import re, zipfile
          path = 'downloads/aws-ai-practitioner-coach.zip'
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              expected = 'aws-ai-practitioner-coach/skill.md'
              assert expected in names, f'Missing {expected}'
              assert 'skill.md' not in names and 'SKILL.md' not in names, 'Loose root skill file found'
              skill = z.read(expected).decode('utf-8')
              front = skill.split('---', 2)[1]
              name_match = re.search(r'^name:\s*(.+)$', front, re.M)
              desc_match = re.search(r'^description:\s*(.+)$', front, re.M)
              assert name_match and name_match.group(1).strip() == 'aws-ai-practitioner-coach'
              assert desc_match and len(desc_match.group(1).strip()) <= 200
          print('Claude Skill ZIP structure is valid')
          PY

      - name: Commit generated Claude download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/aws-ai-practitioner-coach.zip
          if git diff --cached --quiet; then
            echo "Claude ZIP is already current"
          else
            git commit -m "Build Claude Skill package"
            git push
          fi
