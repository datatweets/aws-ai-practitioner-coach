name: Materialize Practice Exams

on:
  push:
    paths:
      - 'practice-exams-src/READY'

permissions:
  contents: write

jobs:
  build-practice-exams:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install reportlab

      - name: Reconstruct source text archive
        shell: bash
        run: |
          cat practice-exams-src/part-*.b64 > /tmp/practice-texts.tar.xz.b64
          base64 --decode /tmp/practice-texts.tar.xz.b64 > /tmp/practice-texts.tar.xz
          mkdir -p /tmp/practice-texts
          tar -xJf /tmp/practice-texts.tar.xz -C /tmp/practice-texts

      - name: Build the three practice exam PDFs
        shell: bash
        run: |
          mkdir -p practice-exams
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import letter

          for i in (1, 2, 3):
              src = Path(f'/tmp/practice-texts/exam{i}.txt')
              text = src.read_text(encoding='utf-8', errors='replace')
              pages = text.split('\f')
              if pages and not pages[-1].strip():
                  pages = pages[:-1]

              out = Path(f'practice-exams/AIF-C01-practice-exam-{i}.pdf')
              c = canvas.Canvas(str(out), pagesize=letter, pageCompression=1)
              _, height = letter
              font_size = 6.45
              leading = 7.2
              max_chars = 125

              for page in pages:
                  c.setFont('Courier', font_size)
                  y = height - 26
                  for line in page.splitlines():
                      chunks = [line[j:j + max_chars] for j in range(0, len(line), max_chars)] or ['']
                      for chunk in chunks:
                          if y < 24:
                              c.showPage()
                              c.setFont('Courier', font_size)
                              y = height - 26
                          c.drawString(24, y, chunk)
                          y -= leading
                  c.showPage()
              c.save()
          PY

      - name: Commit practice exams
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practice-exams/AIF-C01-practice-exam-1.pdf \
                  practice-exams/AIF-C01-practice-exam-2.pdf \
                  practice-exams/AIF-C01-practice-exam-3.pdf
          git commit -m "Add three AIF-C01 practice exam PDFs"
          git push
